plugins {
    alias(libs.plugins.android.application)
    id 'jacoco'
}

android {
    namespace = 'com.mfrankic.sketchid'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.mfrankic.sketchid"
        minSdk = 27
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

jacoco {
    toolVersion = "0.8.11"
}

// Common file filter for all coverage reports
def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        '**/*Tests*.*',
        'android/**/*.*',
        '**/databinding/**/*.*',
        '**/BR.class'
]

// Common source and class directories
def coverageSourceDirs = [
        "${project.projectDir}/src/main/java"
]

def coverageClassDirs = fileTree(
        dir: layout.buildDirectory.dir("intermediates/javac/debug/compileDebugJavaWithJavac/classes"),
        excludes: coverageExclusions
)

// Unit test coverage only
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn['testDebugUnitTest']
    group = "Reporting"
    description = "Generate Jacoco coverage reports for unit tests only."

    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml")
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/test/html")
    }

    sourceDirectories.from = files(coverageSourceDirs)
    classDirectories.from = files([coverageClassDirs])
    executionData.from = fileTree(dir: layout.buildDirectory.dir("outputs/unit_test_code_coverage"), includes: ["**/*.exec"])
}

// Unit test coverage (same as jacocoTestReport, kept for compatibility)
tasks.register('jacocoCombinedTestReport', JacocoReport) {
    dependsOn(['testDebugUnitTest'])
    group = "Reporting"
    description = "Generate Jacoco coverage reports for unit tests (alias for compatibility)."

    reports {
        xml.required = true
        html.required = true
        csv.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/combined/jacocoCombinedTestReport.xml")
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/combined/html")
        csv.outputLocation = layout.buildDirectory.file("reports/jacoco/combined/jacocoCombinedTestReport.csv")
    }

    sourceDirectories.from = files(coverageSourceDirs)
    classDirectories.from = files([coverageClassDirs])

    // Unit test execution data only
    executionData.from = files([
            fileTree(dir: layout.buildDirectory.dir("outputs/unit_test_code_coverage"), includes: ["**/*.exec"])
    ])
}

// Task to clean all coverage reports
tasks.register('cleanCoverageReports', Delete) {
    group = "Reporting"
    description = "Clean all Jacoco coverage reports."
    delete layout.buildDirectory.dir("reports/jacoco")
}

// Task to run all tests and generate combined coverage
tasks.register('fullTestCoverage') {
    dependsOn(['cleanCoverageReports', 'testDebugUnitTest', 'jacocoCombinedTestReport'])
    group = "Reporting"
    description = "Run unit tests and generate coverage report (full coverage)."

    // Ensure proper task ordering
    tasks.named('testDebugUnitTest').get().mustRunAfter('cleanCoverageReports')
    tasks.named('jacocoCombinedTestReport').get().mustRunAfter('testDebugUnitTest')
}

// Task to run unit tests and generate coverage
tasks.register('unitTestCoverage') {
    dependsOn(['testDebugUnitTest', 'jacocoTestReport'])
    group = "Reporting"
    description = "Run unit tests and generate coverage report."

    tasks.named('jacocoTestReport').get().mustRunAfter('testDebugUnitTest')
}

tasks.named('jacocoTestReport') {
    mustRunAfter 'testDebugUnitTest'
}

tasks.named('jacocoCombinedTestReport') {
    mustRunAfter 'testDebugUnitTest'
}

dependencies {
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.activity)
    implementation(libs.constraintlayout)
    implementation(libs.room.common)
    implementation(libs.room.runtime)
    implementation(libs.preference)
    implementation(libs.glide)
    implementation(libs.gson)

    testImplementation(libs.junit)
    testImplementation(libs.mockito.core)
    testImplementation(libs.mockito.inline)
    testImplementation(libs.robolectric)

    annotationProcessor(libs.room.compiler)
    annotationProcessor(libs.glide.compiler)
}

sonar.projectKey=SketchID
sonar.projectName=SketchID
sonar.projectVersion=1.0

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java
sonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.test.binaries=app/build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes
sonar.exclusions=**/build/**,**/target/**

# JaCoCo coverage report path
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml

sonar.sourceEncoding=UTF-8

sonar.host.url=http://localhost:9000
